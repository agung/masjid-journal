name: Production deployment
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: masjid-journal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node.js 24)
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vinext check
      - run: npm run build:vinext
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply masjid-journal --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx @vinext/cloudflare deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 https://masjid-journal.${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev/api/health
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 https://masjid-journal.${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev/sign-in
