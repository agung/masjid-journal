name: Production deployment
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: masjid-journal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vinext check
      - run: npm run build:vinext
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply masjid-journal --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx @vinext/cloudflare deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 5 https://masjid-journal.${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev/api/health
          curl --fail --retry 8 --retry-delay 5 https://masjid-journal.${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev/login
